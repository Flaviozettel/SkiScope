<header class="site-header">
  <div class="wrapper">
    <h1 class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
    <nav class="site-nav">
      {% for item in site.navbar %} {% if item.title == "Funktionalitäten" %}
      <div class="dropdown">
        <a href="{{ item.url | relative_url }}" class="site-nav-link"
          >{{ item.title }}</a
        >
        <div class="dropdown-content">
          <a href="{{ '/01_xxxx.html' | relative_url }}">xxxx</a>
          <a href="{{ '/02_xxxx.html'   | relative_url }}">xxxx</a>
          <a href="{{ '/03_xxxx.html'    | relative_url }}">xxxx</a>
          <a href="{{ '/04_xxxx.html'   | relative_url }}">xxxx</a>
        </div>
      </div>
      {% else %}
      <a class="site-nav-link" href="{{ item.url | relative_url }}">
        {{ item.title }}
      </a>
      {% endif %} {% endfor %}
    </nav>
  </div>
</header>
