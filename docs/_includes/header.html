<header class="site-header">
  <div class="wrapper">
    <h1 class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
    <nav class="site-nav">
      {% for item in site.navbar %} 
      {% if item.children %}
      <div class="dropdown">
        <a href="{{ item.url | relative_url }}" class="site-nav-link"
          >{{ item.title }}</a>
        <div class="dropdown-content">
          {% for child in item.children %}
          <a href="{{ child.url | relative_url }}">{{ child.title }}</a>
          {% endfor %}
        </div>
      </div>
      {% else %}
      <a class="site-nav-link" href="{{ item.url | relative_url }}">
        {{ item.title }}
      </a>
      {% endif %} {% endfor %}
    </nav>
  </div>
</header>
